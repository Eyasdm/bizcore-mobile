# XcodeGen project spec for BizCore Mobile
# -----------------------------------------
# The repo ships as a Swift package (Package.swift) for tooling, but Xcode
# cannot RUN a .library product as an iOS app. This spec generates a real
# iOS application target so the app can launch on a simulator for screenshots.
#
# On a Mac:
#   brew install xcodegen      # one time
#   xcodegen generate          # creates BizCoreMobile.xcodeproj from this file
#   open BizCoreMobile.xcodeproj
#   # select the iPhone 15 Pro simulator and Run
#
# The generated .xcodeproj stays gitignored on purpose — it is a build
# artifact, regenerated from this committed spec on each machine.
#
# NOTE: The Info.plist is now an explicit committed file (./Info.plist) rather
# than auto-generated, because background-task keys (UIBackgroundModes,
# BGTaskSchedulerPermittedIdentifiers) are arrays that GENERATE_INFOPLIST_FILE
# cannot express. GENERATE_INFOPLIST_FILE is therefore NO and version/bundle
# keys are filled from the build settings below via $(VARIABLE) substitution.

name: BizCoreMobile

options:
  bundleIdPrefix: com.bizcore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  BizCoreMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/BizCoreMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bizcore.BizCoreMobile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone
        GENERATE_INFOPLIST_FILE: NO          # using the explicit Info.plist below
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: BizCoreMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
